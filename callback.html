<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Tesla Nav sign-in</title>
  <style>
    :root { color-scheme: light dark; --fg: #1d1d1f; --muted: #6e6e73; --bg: #fbfbfd; --accent: #e31937; }
    @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --muted: #a1a1a6; --bg: #111113; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 520px; margin: 0 auto; padding: 56px 20px; text-align: center; }
    a.button { display: inline-block; margin-top: 16px; padding: 12px 22px; border-radius: 12px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
    code { display: block; margin-top: 24px; padding: 12px; border-radius: 10px; background: rgba(127,127,127,.12); word-break: break-all; font-size: 13px; text-align: left; }
    .muted { color: var(--muted); font-size: 15px; }
  </style>
</head>
<body>
<main>
  <h1 id="title">Returning to Tesla Nav…</h1>
  <p class="muted" id="detail"></p>
  <a class="button" id="open" href="#" hidden>Open Tesla Nav</a>
  <code id="code" hidden></code>
</main>
<script>
  // Tesla redirects here with ?code=…&state=… (or ?error=…). Hand the same query to the iPhone app.
  (function () {
    var query = window.location.search;
    var params = new URLSearchParams(query);
    var appURL = "teslanav://oauth-callback" + query;
    var title = document.getElementById("title");
    var detail = document.getElementById("detail");
    var open = document.getElementById("open");
    var codeBox = document.getElementById("code");

    if (params.get("error")) {
      title.textContent = "Sign-in was not completed";
      detail.textContent = params.get("error_description") || params.get("error");
    } else if (!params.get("code")) {
      title.textContent = "Nothing to do here";
      detail.textContent = "This page is used only when signing in to Tesla from Tesla Nav.";
      return;
    } else {
      detail.textContent = "If the app does not open, tap the button. On a computer, copy the code below.";
      codeBox.textContent = params.get("code");
      codeBox.hidden = false;
    }
    open.href = appURL;
    open.hidden = false;
    window.location.replace(appURL);
  })();
</script>
</body>
</html>
